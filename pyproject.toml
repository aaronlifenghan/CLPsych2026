[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clpsych_2026"
version = "0.1.0"
description = "CLPsych 2026 Shared Tasks: Predicting psychological centrality (presence) ratings for adaptive and maladaptive self-states in social media posts using the MIND framework and LLMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
system3 = [
  "langchain>=0.3.27",
  "langchain-ollama>=0.3.8",
  "langchain-openai>=0.3.33",
  "langchain-google-genai>=2.1.0",
  "pydantic>=2.11.9",
  "pyyaml>=6.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.4.0",
]
hf = [
  "transformers>=4.45.0",
  "torch>=2.2.0",
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
]
debug = ["jupyterlab>=4.4.3", "ruff>=0.11.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/clpsych_assessment"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md"]
exclude = ["*.pyc", "__pycache__", ".git", "tests"]

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 79

[tool.pyright]
include = ["src"]
reportUnusedImport = false
reportUnusedVariable = false
reportMissingImports = "error"
reportMissingTypeStubs = false
executionEnvironments = [{ root = "src" }]
